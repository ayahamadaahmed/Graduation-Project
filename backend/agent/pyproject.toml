[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "medmind-agent"
version = "0.1.0"
description = "MedMind healthcare AI agent runtime"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["medmind*"]
